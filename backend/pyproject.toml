[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "quantitative-molecular-imaging-backend"
version = "0.2.0"
description = "Research backend for quantitative PET/CT molecular imaging workflows."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "William Popkov" },
]
keywords = [
    "dicom",
    "dicomweb",
    "medical-imaging",
    "molecular-imaging",
    "pet-ct",
    "quantitative-imaging",
    "research",
]

dependencies = [
    "Django>=5.2.16,<5.3",
    "djangorestframework>=3.17.1,<3.18",
    "psycopg[binary]>=3.3.4,<3.4",
    "celery[redis]>=5.6.3,<5.7",
    "pydicom>=3.0.2,<3.1",
    "SimpleITK>=2.5.5,<2.6",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "matplotlib>=3.10,<4.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "requests>=2.32,<3.0",
]


[project.optional-dependencies]
dev = [
    "django-stubs>=5.2,<5.3",
    "djangorestframework-stubs>=3.16,<3.17",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-django>=4.11,<5.0",
    "ruff>=0.15.22,<0.16",
    "types-requests>=2.32,<3.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "config*",
    "integrations*",
    "reporting*",
    "scientific*",
]
exclude = [
    "tests*",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]
extend-exclude = [
    "migrations",
]


[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DJ",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "ANN401",
    "COM812",
    "EXE002",
    "ISC001",
]


[tool.ruff.lint.per-file-ignores]
"manage.py" = [
    "T201",
]
"config/settings/*.py" = [
    "F403",
    "F405",
]
"tests/**/*.py" = [
    "ANN",
    "ARG",
    "PLR2004",
    "S101",
]


[tool.ruff.lint.isort]
known-first-party = [
    "apps",
    "config",
    "integrations",
    "reporting",
    "scientific",
]


[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88


[tool.mypy]
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
]
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = [
    "^apps/.*/migrations/",
]


[tool.django-stubs]
django_settings_module = "config.settings.test"


[[tool.mypy.overrides]]
module = [
    "pydicom.*",
    "scipy.*",
    "SimpleITK.*",
    "sklearn.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = [
    "test_*.py",
    "*_test.py",
]
testpaths = [
    "tests",
]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--showlocals",
    "--tb=short",
]
markers = [
    "integration: tests requiring PostgreSQL, Redis, Orthanc, or network services",
    "real_data: tests requiring the verified public DICOM dataset subset",
    "regression: deterministic numerical regression tests using real data",
    "end_to_end: tests covering complete platform workflows",
]


[tool.coverage.run]
branch = true
source = [
    "apps",
    "config",
    "integrations",
    "reporting",
    "scientific",
]
omit = [
    "*/migrations/*",
    "manage.py",
]


[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
